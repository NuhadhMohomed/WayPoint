name: WayPoint Continuous Integration

on:
  push:
    branches: [ main, develop, "feature/**" ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. Authoritative ASP.NET Core Backend Pipeline (REQ-CICD-01, REQ-GIT-01)
  # =========================================================================
  backend-ci:
    name: Backend CI (.NET 8)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Backend Dependencies
        run: dotnet restore backend/WayPoint.sln

      - name: Build Backend Solution
        run: dotnet build backend/WayPoint.sln --no-restore --configuration Release

      - name: Run Backend Automated Tests
        run: >
          dotnet test backend/WayPoint.sln
          --no-build
          --configuration Release
          --verbosity normal
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults/backend

      - name: Upload Backend Test & Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: ./TestResults/backend
          retention-days: 7

  # =========================================================================
  # 2. React Web Frontend Pipeline (Vite + Vitest)
  # =========================================================================
  frontend-ci:
    name: Web Frontend CI (React + Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package.json

      - name: Install Dependencies
        run: npm install

      - name: Run Web Automated Tests (Vitest)
        run: npm run test

      - name: Build Production Web Bundle
        run: npm run build

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  # =========================================================================
  # 3. Flutter Mobile Application Pipeline (Static Analysis & Tests)
  # =========================================================================
  mobile-ci:
    name: Mobile CI (Flutter 3.x)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Static Code Analysis (flutter analyze)
        run: flutter analyze

      - name: Run Flutter Automated Tests
        run: flutter test --coverage

      - name: Upload Mobile Coverage Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-coverage
          path: mobile/coverage
          retention-days: 7

  # =========================================================================
  # 4. Python AI Subsystem Pipeline (LangGraph & Multi-Agent Tests)
  # =========================================================================
  ai-ci:
    name: AI Agents CI (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai/requirements.txt

      - name: Install AI Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ai/requirements.txt
          pip install pytest pytest-asyncio flake8

      - name: Lint Code with Flake8
        run: |
          flake8 ai --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run AI Agent Automated Tests (Pytest)
        env:
          GEMINI_API_KEY: "ci-dummy-key"
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/waypoint_ci"
        run: pytest ai/tests -v

  # =========================================================================
  # 5. Monorepo Quality Gate Status
  # =========================================================================
  ci-quality-gate:
    name: CI Monorepo Quality Gate
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci, mobile-ci, ai-ci]
    if: always()
    steps:
      - name: Verify All Tier Pipelines
        run: |
          echo "=================================================="
          echo "       WayPoint CI Monorepo Quality Gate          "
          echo "=================================================="
          echo "Backend CI:  ${{ needs.backend-ci.result }}"
          echo "Frontend CI: ${{ needs.frontend-ci.result }}"
          echo "Mobile CI:   ${{ needs.mobile-ci.result }}"
          echo "AI Agents:   ${{ needs.ai-ci.result }}"
          echo "=================================================="
          
          if [[ "${{ needs.backend-ci.result }}" != "success" || \
                "${{ needs.frontend-ci.result }}" != "success" || \
                "${{ needs.mobile-ci.result }}" != "success" || \
                "${{ needs.ai-ci.result }}" != "success" ]]; then
            echo "❌ CI Quality Gate Failed! One or more pipelines did not succeed."
            exit 1
          fi
          
          echo "✅ All CI pipelines completed successfully!"
